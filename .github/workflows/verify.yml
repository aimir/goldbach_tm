name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  computational:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python3 tools/verify24.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/audit.py
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'true'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Check headline axiom dependencies
        working-directory: formal
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          result = subprocess.run(
              ['lake', 'env', 'lean', 'CheckAxioms.lean'],
              check=True, capture_output=True, text=True,
          )
          print(result.stdout)
          match = re.search(r'depends on axioms:\s*\[(.*?)\]', result.stdout, re.S)
          assert match, 'Missing headline axiom report'
          actual = {name.strip() for name in match.group(1).split(',')}
          assert actual == {'propext', 'Classical.choice', 'Quot.sound'}, actual
          PY
